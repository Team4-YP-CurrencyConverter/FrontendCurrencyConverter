name: Eslint test

on:
  push:
    branches: 
      - '**'
  
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  eslint_test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub Actions 
        uses: actions/checkout@v4

      - name: Use Node.js v24.x
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Installing dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint
